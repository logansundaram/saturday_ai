[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "saturday-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
